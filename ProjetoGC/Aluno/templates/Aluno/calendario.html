{% extends "aluno/base.html" %}
{% load static %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-4 border-bottom">
    <div>
        <h1 class="h2 mb-1">Calendário</h1>
        <p class="text-muted mb-0">Acompanhe seus eventos e prazos importantes.</p>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <div class="card-aluno">
            <div class="card-body">
                <div id="calendar"></div>
            </div>
        </div>
    </div>
</div>

<!-- CSS do FullCalendar -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">

<!-- JS do FullCalendar -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    
    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'pt-br',
        events: "{% url 'aluno:eventos_api' %}",
        displayEventTime: true,
        eventDisplay: 'block',
        
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },

        buttonText: {
            today: 'Hoje',
            month: 'Mês',
            week: 'Semana',
            day: 'Dia'
        },

        eventDidMount: function(info) {
            // Adicionar tooltip personalizado
            info.el.setAttribute('title', info.event.title + ' - ' + info.event.extendedProps.description);
        },

        eventClick: function(info) {
            // Mostrar detalhes do evento
            alert(
                'Evento: ' + info.event.title + '\n' +
                'Descrição: ' + (info.event.extendedProps.description || 'Sem descrição') + '\n' +
                'Turma: ' + (info.event.extendedProps.turma || 'Não informada') + '\n' +
                'Início: ' + info.event.start.toLocaleString() + '\n' +
                (info.event.end ? 'Fim: ' + info.event.end.toLocaleString() : '')
            );
        }
    });

    calendar.render();
});
</script>
{% endblock %}
{% endblock %}
