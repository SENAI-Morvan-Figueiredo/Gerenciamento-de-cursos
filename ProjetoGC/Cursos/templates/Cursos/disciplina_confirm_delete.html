 <!-- Secretaria/Abase.html/disciplina_confirm_delete.html -->
{% extends "secretaria/Abase.html" %}
{% load static %}

{% block content %}
<div class="content-header">
    <h1>Confirmar Exclusão</h1>
</div>

<div class="form-container" style="text-align: center;">
    <h2 style="color: var(--laranja); margin-bottom: 2rem;">
        <i data-lucide="alert-triangle" style="width: 32px; height: 32px;"></i>
        Deseja realmente deletar a disciplina "{{ object.nome }}"?
    </h2>
    
    <p style="margin-bottom: 2rem; color: var(--cinza-claro);">
        Esta ação não pode ser desfeita. Todas as relações desta disciplina com cursos serão removidas.
    </p>

    <form method="post" style="display: inline-block;">
        {% csrf_token %}
        <button type="submit" class="btn" style="background: var(--laranja); color: var(--branco);">
            <i data-lucide="trash-2"></i>
            Confirmar Exclusão
        </button>
    </form>
    
    <a href="{% url 'disciplina_list' curso.pk %}" class="btn btn-style3" style="margin-left: 1rem;">
        <i data-lucide="arrow-left"></i>
        Cancelar
    </a>
</div>

<script>
    lucide.createIcons();
</script>
{% endblock %}
