{% if validlink %}
<h2> Defina a nova senha </h2>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}
    
    <button type="submit">Enviar</button>
{% else %}
    <h2> Link inválido </h2>
    <p> O link para redefinir a senha é inválido, possivelmente porque já foi usado ou expirou. Solicite um novo link de redefinição de senha. </p>
{% endif %}
