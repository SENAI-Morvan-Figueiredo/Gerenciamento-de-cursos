{% load static %}


<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SENAI</title>
    <link rel="stylesheet" href="{% static 'Login/css/style.css' %}">
</head>
<body>
    <div class="login-container">
        <div class="header">
            <img src="{% static 'Login/img/senai_logo.png' %}" alt="SENAI Logo" class="senai-logo">
        </div>
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li class="{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        
        <p>Verifique seu e-mail para redefinir sua senha.</p>

        <div class="footer">
            <p>&copy; SENAI-SP - 2025</p>
        </div>
    </div>
</body>
</html>
