{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Painel SENAI{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="header-left">
            <img src="{% static 'img/senai_logo.png' %}" alt="SENAI" class="senai-logo">
            <span class="welcome-text">BEM-VINDO, PROFESSOR ANDERSON</span>
        </div>

        <div class="header-right">
            <span class="weekday">Segunda-Feira</span>
            <span class="date">23/02/2026</span>
            <div class="icons">
                <i class="mail-icon">📧</i>
                <i class="bell-icon">🔔</i>
            </div>
        </div>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
