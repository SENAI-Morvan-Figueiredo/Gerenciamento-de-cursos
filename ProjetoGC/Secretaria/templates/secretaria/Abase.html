{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Secretaria - Sistema{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="https://unpkg.com/lucide@latest"></script> <!-- ícones -->
</head>
<body>
    {% include 'partials/header.html' %}

    <div class="layout">
        <!-- MENU LATERAL -->
        <aside class="sidebar">

            <nav class="sidebar-menu">
                <a href="{% url 'secretaria:turmaList' %}" class="menu-item">
                    <i data-lucide="layers"></i>
                    <span>Turmas</span>
                </a>
                <a href="{% url 'secretaria:profList' %}" class="menu-item">
                    <i data-lucide="users"></i>
                    <span>Professores</span>
                </a>
                <a href="{% url 'secretaria:alunoList' %}" class="menu-item">
                    <i data-lucide="user"></i>
                    <span>Alunos</span>
                </a>
                <a href="#" class="menu-item">
                    <i data-lucide="file-text"></i>
                    <span>Configurações</span>
                </a>
            </nav>
        </aside>

        <!-- CONTEÚDO PRINCIPAL -->
        <div class="main-content">
            <main class="content-area">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- <script src="{% static 'js/script.js' %}"></script> -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
