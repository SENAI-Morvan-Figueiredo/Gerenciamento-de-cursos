{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Secretaria - Sistema{% endblock %}</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" herf="{% static 'css/respon.css' %}">

    <link rel="stylesheet" href="{% static 'css/form.css' %}">
    <link rel="stylesheet" href="{% static 'css/lists.css' %}">
    

    <!-- ICONES -->
    <script src="https://unpkg.com/lucide@latest"></script>

</head>
<body>
  {% include 'partials/header.html' %}

    <div class="layout">
        <!-- MENU LATERAL -->
        <aside class="sidebar">
            <nav class="sidebar-menu">
                <a href="{% url 'secretaria:turmaList' %}" class="menu-item {% if 'turma' in request.resolver_match.url_name %}active{% endif %}">
                    <i data-lucide="layers"></i>
                    <span>Turmas</span>
                </a>
                <a href="{% url 'curso_list' %}" class="menu-item {% if 'curso' in request.resolver_match.url_name or 'disciplina' in request.resolver_match.url_name %}active{% endif %}">
                    <i data-lucide="layers-2"></i>
                    <span>Cursos</span>
                </a>
                <a href="{% url 'secretaria:profList' %}" class="menu-item {% if 'prof' in request.resolver_match.url_name %}active{% endif %}">
                    <i data-lucide="user"></i>
                    <span>Professores</span>
                </a>
                <a href="{% url 'secretaria:alunoList' %}" class="menu-item {% if 'aluno' in request.resolver_match.url_name %}active{% endif %}">
                    <i data-lucide="users"></i>
                    <span>Alunos</span>
                </a>
                <a href="{% url 'secretaria:calendario' %}" class="menu-item {% if 'solicitacao' in request.resolver_match.url_name %}active{% endif %}">
                    <i data-lucide="clipboard-pen"></i>
                    <span>Calendar</span>
                </a>
                <a href="{% url 'solicitacao:solicitacaoList' %}" class="menu-item {% if 'solicitacao' in request.resolver_match.url_name %}active{% endif %}">
                    <i data-lucide="clipboard-pen"></i>
                    <span>Solicitações</span>
                </a>
                <a href="{% url 'secretaria:config' %}" class="menu-item {% if 'config' in request.resolver_match.url_name %}active{% endif %}">
                    <i data-lucide="settings"></i>
                    <span>Configurações</span>
                </a>
            </nav>
        </aside>

  <!-- Overlay
  <div id="overlay" class="overlay hidden"></div>

  <div class="layout"> -->
    <!-- SIDEBAR -->
    <!-- <aside id="sidebar" class="sidebar">
      <nav class="sidebar-menu">

        <a href="#" class="menu-item">

        </a>

    </aside> -->

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="main-content">
      <main class="content-area">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const sidebar = document.getElementById("sidebar");
    const toggleBtn = document.getElementById("menu-toggle");
    const overlay = document.getElementById("overlay");

    let isOpen = false;

    toggleBtn.addEventListener("click", () => {
      sidebar.classList.toggle("open");
      overlay.classList.toggle("hidden");
      isOpen = !isOpen;
      toggleBtn.classList.toggle("active");
      updateIcon();
    });

    overlay.addEventListener("click", closeMenu);

    function closeMenu() {
      sidebar.classList.remove("open");
      overlay.classList.add("hidden");
      isOpen = false;
      toggleBtn.classList.remove("active");
      updateIcon();
    }

    function updateIcon() {
      const iconName = isOpen ? "x" : "menu";
      toggleBtn.innerHTML = `<i data-lucide="${iconName}"></i>`;
      lucide.createIcons();
    }
  </script>
</body>
</html>
