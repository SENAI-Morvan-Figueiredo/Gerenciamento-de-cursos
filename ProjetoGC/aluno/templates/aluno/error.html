{% extends "aluno/base.html" %}
{% load static %}

{% block title %}Erro - Portal do Aluno{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card mt-5">
                <div class="card-body text-center py-5">
                    <i class="fas fa-exclamation-circle fa-4x text-warning mb-4"></i>
                    <h3 class="text-danger mb-3">Ops! Algo deu errado</h3>
                    <p class="text-muted mb-4">{{ message }}</p>
                    <div class="d-flex gap-2 justify-content-center">
                        <a href="{% url 'aluno:dashboard_aluno' %}" class="btn btn-primary">
                            <i class="fas fa-arrow-left me-2"></i>Voltar ao Dashboard
                        </a>
                        <a href="{% url 'aluno:solicitacoes' %}" class="btn btn-outline">
                            <i class="fas fa-question-circle me-2"></i>Pedir Ajuda
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
