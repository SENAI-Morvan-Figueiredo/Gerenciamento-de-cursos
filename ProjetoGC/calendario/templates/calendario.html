{% extends base_template %}

{% load static %}

{% block content %}
<div id="calendar"></div>
<div id="tooltip" class="tooltip"></div>

<!-- CSS do FullCalendar -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">

<!-- JS do FullCalendar -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    var tooltip = document.getElementById('tooltip');
    var tooltipFixo = false;
    var eventoAtivo = null;

    var calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'dayGridMonth',
      locale: 'pt-br',
      events: '/calendario/eventos/',
      displayEventTime: false,
      eventDisplay: 'list-item',

      headerToolbar: {
        left: 'prev',
        center: 'title',
        right: 'today next'
      },

      buttonText: {
        today: 'Hoje'
      },

      eventDidMount: function(info) {
        var evento = info.event;
        var props = evento.extendedProps || {};
        
        // 🔹 CORREÇÃO AQUI: Use o turma_id dos props OU use null
        var turmaId = props.turma_id;  // Não use fallback para 1!
        var turmaNome = props.turma || 'Turma';
        var descricao = props.description || 'Sem descrição';
        
        
        // 🔹 Use a URL que já vem do servidor (redirect_url)
        // Ela já tem o turma_id correto
        var url = props.redirect_url;
        
        // Se não tiver URL, construa com o turmaId correto
        if (!url && turmaId) {
          url = `http://gustavodutra237.pythonanywhere.com/professor/turma/${turmaId}/atividades/${evento.id}/`;
        } else if (!url && !turmaId) {
          // Se não tiver turmaId, mostre erro
          console.error('Evento sem turma_id:', evento.id);
          url = '#';
        }
        
        info.el.addEventListener('mouseenter', function(e) {
          if (!tooltipFixo) {
            tooltip.innerHTML = `
              <h4 style="
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
                text-overflow: ellipsis;
                line-clamp: 2;
                max-width: 250px;
                margin: 0 0 8px 0;
                font-size: 16px;
                line-height: 1.3;
                white-space: normal;
              ">${evento.title}</h4>
              <p>${descricao}</p>
              `;
            tooltip.style.display = 'block';
            tooltip.style.left = (e.pageX - 130) + 'px';
            tooltip.style.top = (e.pageY + 20) + 'px';
            tooltip.style.opacity = '1';
            
            if (url && url !== '#') {
              tooltip.dataset.url = url;
              tooltip.style.cursor = 'pointer';
              tooltip.classList.add('clickable-tooltip');
            } else {
              tooltip.dataset.url = '';
              tooltip.style.cursor = 'default';
              tooltip.classList.remove('clickable-tooltip');
            }
          }
        });

        info.el.addEventListener('mousemove', function(e) {
          if (!tooltipFixo) {
            tooltip.style.left = (e.pageX - 130) + 'px';
            tooltip.style.top = (e.pageY + 20) + 'px';
          }
        });

        info.el.addEventListener('mouseleave', function() {
          if (!tooltipFixo) {
            tooltip.style.display = 'none';
            tooltip.style.opacity = '0';
          }
        });

        info.el.addEventListener('click', function(e) {
          e.stopPropagation();

          if (tooltipFixo && eventoAtivo === info.el) {
            tooltipFixo = false;
            tooltip.style.display = 'none';
            eventoAtivo = null;
          } else {
            tooltipFixo = true;
            eventoAtivo = info.el;
            
            tooltip.innerHTML = `
              <h4 style="
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
                text-overflow: ellipsis;
                line-clamp: 2;
                max-width: 250px;
                margin: 0 0 8px 0;
                font-size: 16px;
                line-height: 1.3;
                white-space: normal;
              ">${evento.title}</h4>
              <p>${descricao}</p>
            `;
            tooltip.style.display = 'block';
            tooltip.style.left = (e.pageX - 130) + 'px';
            tooltip.style.top = (e.pageY + 20) + 'px';
            tooltip.style.opacity = '1';
            
            if (url && url !== '#') {
              tooltip.dataset.url = url;
              tooltip.style.cursor = 'pointer';
              tooltip.classList.add('clickable-tooltip');
            } else {
              tooltip.dataset.url = '';
              tooltip.style.cursor = 'default';
              tooltip.classList.remove('clickable-tooltip');
            }
          }
        });
      },

      eventContent: function() {
        return { html: '<div class="fc-daygrid-event-dot"></div>' };
      }
    });

    tooltip.addEventListener('click', function() {
      if (tooltip.dataset.url && tooltip.dataset.url !== '#') {
        console.log('Redirecionando para:', tooltip.dataset.url);
        window.location.href = tooltip.dataset.url;
      } else {
        console.log('URL não disponível para redirecionamento');
      }
    });

    document.addEventListener('click', function(e) {
      if (tooltipFixo && !tooltip.contains(e.target)) {
        tooltipFixo = false;
        tooltip.style.display = 'none';
        eventoAtivo = null;
      }
    });

    calendar.render();
  });
</script>

{% endblock %}
